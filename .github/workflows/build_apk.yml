name: Build Android APK (Zero Terminal)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pasted Files
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Generate Android Wrapper & Permissions
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak
          flutter create --platforms=android --org com.nutrition --project-name nutrition_tracker .
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib && mv lib_bak lib
          sed -i 's/<application/<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Enable Core Library Desugaring (Kotlin DSL)
        run: |
          KTS_FILE="android/app/build.gradle.kts"
          if [ -f "$KTS_FILE" ]; then
            # Enable core library desugaring inside compileOptions
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' "$KTS_FILE"
            
            # Append the desugaring dependency safely at the end of the file
            echo "" >> "$KTS_FILE"
            echo "dependencies {" >> "$KTS_FILE"
            echo "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")" >> "$KTS_FILE"
            echo "}" >> "$KTS_FILE"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Drift SQLite Database Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
